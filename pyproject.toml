[project]
name = "dependabot-agent"
version = "0.1.0"
description = "LangGraph agent that resolves Dependabot vulnerability warnings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=2.1.0",
    "langgraph>=1.0.0",
    "packaging>=24.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "dependabot_agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
